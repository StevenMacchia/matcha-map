<style>/* Dashboard at /m/: the site's tokens (style.css), plain drawn charts. Phone first. */

@media (prefers-color-scheme: dark) { :root { --canvas: #17211A; --panel: #1F2B22; --ink: #F3EADB; --muted: #C9BDAA; --deep: #B8DFA8; --accent: #A9D59A; --line: #33473A; --foam: #2B3D2F; --pink: #F1C6D2; --pink-edge: #F1C6D2; --shadow: 0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3); } }
* { box-sizing: border-box; }
body { margin: 0; font: 500 16px/1.45 var(--font); background: var(--canvas); color: var(--ink); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.top { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: var(--canvas); border-bottom: 1px solid var(--line); }
h1 { margin: 0; font-size: 18px; font-weight: 700; } h1 span { color: var(--deep); }
h2 { margin: 0 0 10px; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 8px 14px; min-height: 40px; font: 700 14px var(--font); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #1F2E1B; }
main { max-width: 1100px; margin: 0 auto; padding: 14px 16px 60px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 16px; }
.grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); margin-top: 14px; }
.tiles { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow); min-width: 0; }
.tile b { display: block; font-size: 30px; line-height: 1.1; font-weight: 700; }
.tile span { font-size: 13px; color: var(--muted); } .tile small { display: block; font-size: 12px; color: var(--muted); }
.tile.pend b { color: var(--muted); opacity: .6; }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--foam); color: var(--deep); vertical-align: middle; text-transform: none; letter-spacing: 0; }
.badge.s { background: var(--pink); color: #5a2a3a; }
.card.sample svg, .card.sample .bars, .card.sample .rank { opacity: .55; }
.gate { max-width: 420px; margin: 40px auto; display: grid; gap: 10px; }
.gate input { padding: 12px; border: 2px solid var(--line); border-radius: 14px; background: var(--canvas); font: inherit; color: inherit; }
.gate button { padding: 12px; border: 0; border-radius: 999px; background: var(--accent); color: #1F2E1B; font: 700 16px var(--font); min-height: 44px; cursor: pointer; }
#gate-msg { margin: 0; color: var(--focus); min-height: 1.4em; }
svg.chart { width: 100%; height: auto; display: block; } svg text { font: 500 11px var(--font); fill: var(--muted); }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 6px; } .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; background: var(--deep); } .legend i.b { background: var(--pink-edge); }
.bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.bars li { display: grid; grid-template-columns: minmax(70px, 38%) 1fr auto; align-items: center; gap: 8px; font-size: 14px; }
.bars .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .bars .bar { height: 14px; background: var(--foam); border-radius: 7px; overflow: hidden; } .bars .bar i { display: block; height: 100%; background: var(--accent); border-radius: 7px; } .bars.pink .bar i { background: var(--pink-edge); } .bars .n { font-weight: 700; min-width: 2ch; text-align: right; }
ol.rank { margin: 0; padding: 0; list-style: none; counter-reset: r; display: grid; gap: 6px; } ol.rank li { counter-increment: r; display: flex; gap: 10px; font-size: 14px; align-items: baseline; } ol.rank li::before { content: counter(r); width: 22px; height: 22px; flex: none; border-radius: 50%; background: var(--foam); color: var(--deep); font-weight: 700; font-size: 12px; display: grid; place-items: center; } ol.rank .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } ol.rank .n { font-weight: 700; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }
.run { display: grid; gap: 4px; font-size: 14px; } .run b { font-weight: 700; } .ok { color: var(--deep); } .bad { color: var(--focus); }
.note { font-size: 13px; color: var(--muted); margin: 14px 0 0; }
@media (min-width: 700px) { .tiles { grid-template-columns: repeat(3, 1fr); } .grid { grid-template-columns: 1fr 1fr; } .wide { grid-column: 1 / -1; } }
@media (min-width: 1000px) { .tiles { grid-template-columns: repeat(6, 1fr); } .tile b { font-size: 34px; } }

<header class="top"><h1>Matcha Map <span>metrics</span></h1>
<div class="seg" role="group" aria-label="Range"><button type="button" data-win="7" aria-pressed="false">7 days</button><button type="button" data-win="30" aria-pressed="true">30 days</button></div></header>
<main id="app">
<form id="gate" hidden></form>
<div id="board" hidden></div>
</main>
<script>window.MM_STATIC = true;</script>
<script>// Dashboard at /m/: asks for the moderator token once (sessionStorage), reads /api/metrics, draws everything in code.
// window.MMDash.render(data, days) is also what the published artifact calls with its own data.
(function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg", W = 30, DATA = null;
  var LABEL = { map_move: "Moved the map", zoom_in: "Zoomed in", zoom_out: "Zoomed out", pin_tap: "Tapped a pin", card_open: "Opened a card", going: "I'm going", directions: "Directions", calendar: "Calendar", share: "Share", near_me: "Near me", search: "Searched", date_filter: "Date filter", list_tap: "Tapped the list", promote: "Promote this pop-up", report: "Report a problem", alerts_signup: "Alerts sign-up", theme_toggle: "Theme toggle" };
  var $ = function (id) { return document.getElementById(id); };

  var sum = function (a, f) { return a.reduce(function (s, x) { return s + (f(x) || 0); }, 0); };

  function tile(label, value, note, cls) { return el("div", { cls: "tile " + (cls || "") }, [el("b", { text: value }), el("span", { text: label }), note ? el("small", { text: note }) : none()]); }
  function card(title, body, cls, badge) {
    var h = el("h2", { text: title });
    if (badge) { h.appendChild(document.createTextNode(" ")); h.appendChild(el("span", { cls: "badge" + (badge.s ? " s" : ""), text: badge.t })); }
    return el("section", { cls: "card " + (cls || "") + (badge && badge.s ? " sample" : "") }, [h].concat(body));
  }

    var m = Math.max.apply(null, items.map(function (x) { return x.count; })) || 1, ul = el("ul", { cls: "bars " + (cls || "") });
    items.forEach(function (x) {
      var i = el("i"); i.style.width = Math.max(2, Math.round(100 * x.count / m)) + "%";
      ul.appendChild(el("li", {}, [el("span", { cls: "nm", text: x.label || x.name, title: x.label || x.name }), el("span", { cls: "bar" }, [i]), el("span", { cls: "n", text: fmt(x.count) })]));
    });
    return ul;
  }
  function rank(items) {
    if (!items.length) return el("p", { cls: "empty", text: "Nothing counted yet." });
    var ol = el("ol", { cls: "rank" });
    items.forEach(function (x) { ol.appendChild(el("li", {}, [el("span", { cls: "nm", text: x.label || x.name, title: x.label || x.name }), el("span", { cls: "n", text: fmt(x.count) })])); });
    return ol;
  }
  // people vs bots, visitors per day: two lines drawn here
  function line(series) {
    var w = 640, h = 220, p = { l: 34, r: 8, t: 10, b: 24 };
    var max = Math.max(4, Math.max.apply(null, series.map(function (d) { return Math.max(d.humanVisitors, d.botVisitors); }))); max = Math.ceil(max / 4) * 4;
    var s = sv("svg", { "class": "chart", viewBox: "0 0 " + w + " " + h, role: "img", "aria-label": "Visitors per day, people and bots" });
    var x = function (i) { return p.l + (series.length < 2 ? 0 : i * (w - p.l - p.r) / (series.length - 1)); }, y = function (v) { return h - p.b - v * (h - p.t - p.b) / max; };
    for (var g = 0; g <= 4; g++) { var gy = y(max * g / 4); s.appendChild(sv("line", { x1: p.l, x2: w - p.r, y1: gy, y2: gy, stroke: "var(--line)", "stroke-width": 1 })); var t = sv("text", { x: p.l - 6, y: gy + 4, "text-anchor": "end" }); t.textContent = Math.round(max * g / 4); s.appendChild(t); }
    [["humanVisitors", "var(--deep)"], ["botVisitors", "var(--pink-edge)"]].forEach(function (k) {
      var pts = series.map(function (d, i) { return x(i).toFixed(1) + "," + y(d[k[0]]).toFixed(1); }).join(" ");
      if (k[0] === "humanVisitors") s.appendChild(sv("polygon", { points: x(0) + "," + y(0) + " " + pts + " " + x(series.length - 1) + "," + y(0), fill: "var(--accent)", opacity: ".25" }));
      s.appendChild(sv("polyline", { points: pts, fill: "none", stroke: k[1], "stroke-width": 3, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    });
    [0, Math.floor((series.length - 1) / 2), series.length - 1].forEach(function (i) { if (!series[i]) return; var t = sv("text", { x: x(i), y: h - 6, "text-anchor": i === 0 ? "start" : i === series.length - 1 ? "end" : "middle" }); t.textContent = series[i].day.slice(5); s.appendChild(t); });
    return s;
  }

  function render(d, win) {

    var has = w.views.human + w.views.bot > 0, pend = !has && !d.sample, sm = d.sample ? { t: "sample", s: 1 } : null;
    var count = function (re) { return sum(w.features, function (f) { return re.test(f.name) ? f.count : 0; }); };
    var sub = pend ? "counting from launch" : d.sample ? "sample" : "last " + win + " days";
    var tiles = el("div", { cls: "tiles" }, [
      tile("People (visitors)", pend ? "—" : fmt(w.visitors.human), sub, pend ? "pend" : ""),

      card("Visitors by state", [bars(w.states.filter(function (x) { return /^[A-Z]{2}$/.test(x.name); }).slice(0, 15).map(function (x) { return { label: x.name, count: x.count }; }))], "", sm),
      card("Pages people view", [bars(w.groups.map(function (x) { return { label: x.name, count: x.count }; }), "pink")], "", sm),
      card("How people use the site", [bars(feats)], "wide", sm),
      card("Top clicked cards", [rank(w.clicked)], "", sm),
      card("RSVPs, top pop-ups", [rank(w.rsvp.top)], "", d.sampleRsvp ? { t: "sample", s: 1 } : null),
      card("Top pages", [rank(w.paths)], "", sm),
      card("Where visitors come from", [rank(w.referrers), el("p", { cls: "note", text: "Devices: " + devs })], "", sm),
      card("Map size", [mapBox], ""),
      card("Run health", [runBox], "")

    if (d.sample) board.appendChild(el("p", { cls: "note", text: "Cards marked sample show made-up numbers for one day, in a lighter tone, so the layout can be seen. Real counting starts at launch." }));
    if (pend) board.appendChild(el("p", { cls: "note", text: "No visits counted yet. Counting starts on the first page view after this branch is deployed." }));
    Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function (b) { b.setAttribute("aria-pressed", String(Number(b.getAttribute("data-win")) === win)); });
  }
  window.MMDash = { render: render };

  function load(tok) {
    return fetch("/api/metrics", { headers: { authorization: "Bearer " + tok }, cache: "no-store" }).then(function (r) {
      if (r.status === 401) throw new Error("That token was not accepted.");
      if (!r.ok) throw new Error("The metrics did not load (" + r.status + ").");
      return r.json();
    });
  }
  function show(d) { DATA = d; $("gate").hidden = true; $("board").hidden = false; render(d, W); }
  Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function (b) {
    b.addEventListener("click", function () { W = Number(b.getAttribute("data-win")); if (DATA) render(DATA, W); });
  });
  var gate = $("gate");
  if (gate && !window.MM_STATIC) {
    gate.addEventListener("submit", function (e) {
      e.preventDefault(); var tok = $("tok").value.trim(); $("gate-msg").textContent = "";
      load(tok).then(function (d) { try { sessionStorage.setItem("mm-metrics-token", tok); } catch (x) { /* private mode */ } show(d); }).catch(function (err) { $("gate-msg").textContent = err.message; });
    });

    if (saved) load(saved).then(show).catch(function () { try { sessionStorage.removeItem("mm-metrics-token"); } catch (x) { /* private mode */ } });
  }
  if (window.MM_STATIC) { window.MMDash.show = show; }
})();
</script>
