<!doctype html>
<html lang="en" class="pg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self'; base-uri 'self'; form-action 'self'">
<title>Claim your brand | Matcha Map</title>
<meta name="description" content="Own a matcha brand? Claim its page so we keep it right.">
<link rel="canonical" href="https://matchamap-cu7.pages.dev/claim/">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF6EA">
<script src="/theme.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/pages.css">
<link rel="stylesheet" href="/add/add.css">
</head>
<body class="pg">
<header class="pg-top"><a class="pg-home" href="/"><svg class="pg-mark" viewBox="0 0 64 64" aria-hidden="true"><use href="/characters.svg#m-base"/></svg><span>Matcha Map</span></a><a class="pg-map" href="/">Open the map</a></header>
<main class="fm">
<div class="fm-hero"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="/characters.svg#m-point"/></svg><h1>Claim your brand</h1></div>
<p class="fm-lead">Your brand, your page.</p>
<form id="claim-form" class="fm-card" data-endpoint="/api/claim" novalidate>
<div class="fm-hp" aria-hidden="true"><label>Company <input name="company" type="text" tabindex="-1" autocomplete="off"></label></div>
<div class="fm-row"><label for="brand">Brand</label><input type="text" id="brand" name="brand" maxlength="80" required><span class="fm-err" data-err="brand" role="alert"></span></div>
<div class="fm-row"><label for="handle">Instagram or TikTok</label><input type="text" id="handle" name="handle" placeholder="@yourbrand" maxlength="200" required><span class="fm-err" data-err="handle" role="alert"></span></div>
<div class="fm-row"><label for="role">Your role</label><input type="text" id="role" name="role" placeholder="Owner, manager, social" maxlength="80" required><span class="fm-err" data-err="role" role="alert"></span></div>
<div class="fm-row"><label for="email">Your email</label><input type="email" id="email" name="email" autocomplete="email" maxlength="254" required><span class="fm-err" data-err="email" role="alert"></span></div>
<div class="fm-row"><label for="proof">Proof link<span class="fm-hint">Your bio page or site that links to this handle</span></label><input type="url" id="proof" name="proof" placeholder="https://" maxlength="400" inputmode="url" required><span class="fm-err" data-err="proof" role="alert"></span></div>
<p class="fm-top" id="form-error" role="alert"></p>
<button class="fm-btn" type="submit">Send claim</button>
<p class="fm-note">We write back by email once we have checked it.</p>
</form>
<section id="done" class="fm-card fm-done" hidden>
<svg viewBox="0 0 64 64" aria-hidden="true"><use href="/characters.svg#m-excited"/></svg>
<h2>Mattie is on it</h2>
<p id="done-msg">Got it. We will check the proof and write back.</p>
<a class="fm-btn alt" href="/">Back to the map</a>
</section>
</main>
<footer class="pg-foot"><p><a href="/privacy/">Privacy</a> &middot; <a href="/data-deletion/">Remove my data</a></p></footer>
<script src="/add/add.js"></script>
</body>
</html>
