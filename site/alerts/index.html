<!doctype html>
<html lang="en" class="pg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self'; base-uri 'self'; form-action 'self'">
<title>Pop-up alerts | Matcha Map</title>
<meta name="description" content="Get an email when a matcha pop-up lands in your city.">
<link rel="canonical" href="https://matchamap.app/alerts/">
<meta name="theme-color" content="#FBF6EA">
<script src="/theme.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/pages.css">
<link rel="stylesheet" href="/add/add.css">
</head>
<body class="pg">
<header class="pg-top"><a class="pg-home" href="/"><svg class="pg-mark" viewBox="0 0 64 64" aria-hidden="true"><use href="/characters.svg#m-base"/></svg><span>Matcha Map</span></a><a class="pg-map" href="/">Open the map</a></header>
<main class="fm">
<div class="fm-hero"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="/characters.svg#m-peek"/></svg><h1>Pop-up alerts</h1></div>
<p class="fm-lead">New pop-up near you? Mattie tells you.</p>
<form id="alerts-form" class="fm-card" data-endpoint="/api/alerts" novalidate>
<div class="fm-hp" aria-hidden="true"><label>Company <input name="company" type="text" tabindex="-1" autocomplete="off"></label></div>
<div class="fm-row"><label for="email">Your email</label><input type="email" id="email" name="email" autocomplete="email" maxlength="254" required><span class="fm-err" data-err="email" role="alert"></span></div>
<div class="fm-row"><label for="city">City</label><select id="city" name="city" data-cities><option value="">Pick a city</option></select><span class="fm-err" data-err="city" role="alert"></span></div>
<div class="fm-row"><label class="fm-check"><input type="checkbox" id="consent" name="consent"><span>Yes, email me about new pop-ups in this city. I can ask to stop any time.</span></label><span class="fm-err" data-err="consent" role="alert"></span></div>
<p class="fm-top" id="form-error" role="alert"></p>
<button class="fm-btn" type="submit">Sign me up</button>
<p class="fm-note">Only your email and city are kept. <a href="/privacy/">Privacy</a></p>
</form>
<section id="done" class="fm-card fm-done" hidden>
<svg viewBox="0 0 64 64" aria-hidden="true"><use href="/characters.svg#m-excited"/></svg>
<h2>Mattie is on it</h2>
<p id="done-msg">You are on the list. We will write when a pop-up lands near you.</p>
<a class="fm-btn alt" href="/">Back to the map</a>
</section>
</main>
<footer class="pg-foot"><p><a href="/privacy/">Privacy</a> &middot; <a href="/data-deletion/">Remove my data</a></p></footer>
<script src="/cities.js"></script>
<script src="/add/add.js"></script>
</body>
</html>
