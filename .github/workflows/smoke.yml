# Smoke test on every push to main: the site must come up in headless Chrome at 1440 and 390 with pins, list rows and no
# uncaught error (tools/smoke.js). Catches a shell that crashes against its own page before visitors do.
name: smoke
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit tests
        run: npm test
      - name: Smoke (local build)
        run: npm run smoke
        env:
          CHROME: /usr/bin/google-chrome
      - name: Smoke (live site)
        if: github.event_name == 'push'
        run: node tools/smoke.js --url https://matchamap-cu7.pages.dev
        env:
          CHROME: /usr/bin/google-chrome
