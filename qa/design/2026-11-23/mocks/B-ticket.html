<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Card mock</title><style>
:root{--canvas:#FBF6EA;--panel:#FFFDF7;--ink:#3B2E27;--muted:#6B5A4F;--deep:#3E6B33;--accent:#8CBF7A;--accent-ink:#1F2E1B;--edge:#6E9A5E;--line:#DCE7D0;--foam:#E6F2DC;--pink:#F6B7C7;--pink-edge:#D98CA2;--peach:#F8D3B5;--focus:#D9667F;--font:"M PLUS Rounded 1c",ui-rounded,"Arial Rounded MT Bold",sans-serif}
*{box-sizing:border-box}body{margin:0;font:500 16px/1.45 var(--font);background:#CFE0C0;color:var(--ink)}
.map{position:absolute;inset:0;background:linear-gradient(135deg,#E9EFDD,#F3E6D6)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-radius:26px 26px 0 0;box-shadow:0 -6px 30px rgba(59,46,39,.18);padding:22px 16px 0;display:flex;flex-direction:column}
.sheet:before{content:"";position:absolute;top:8px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:99px;background:rgba(107,90,79,.4)}
.x{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--edge);background:var(--panel);color:var(--deep);font-size:22px}
h1{margin:0;font-size:24px;line-height:1.15;color:var(--deep)}.sub{color:var(--muted);font-size:15px}
.pill{display:inline-block;padding:2px 12px;border-radius:99px;background:var(--foam);color:var(--deep);font-weight:800;font-size:14px}
.btn{min-height:46px;padding:0 20px;border-radius:99px;border:1.5px solid var(--edge);background:var(--panel);color:var(--deep);font:800 15px var(--font);display:inline-flex;align-items:center;gap:6px}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.art{height:120px;border-radius:18px;background:linear-gradient(120deg,#FDE9D7,#E6F2DC);border:2px solid #4B3426;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px}
.quote{background:#F4EFE6;border-radius:16px;padding:10px 14px;font-size:15px}
.lab{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip{padding:3px 12px;border-radius:99px;border:2px solid #4B3426;background:#E6F2DC;font-weight:800;font-size:14px;display:inline-block;margin:0 4px 6px 0}
</style><div class="map"></div><div class="sheet" style="height:700px;width:390px">
<button class="x">&times;</button>
<div style="display:flex;gap:12px;align-items:center;margin-right:48px"><div class="art" style="width:92px;height:92px;flex:none;font-size:14px;text-align:center">photo</div><div><h1>Heyteausa</h1><div class="sub">pop-up &middot; New York</div><div style="margin-top:6px"><span class="pill">$1</span> <span class="pill" style="background:#FDE4EB;color:#6b2a3d">Date not confirmed</span></div></div></div>
<div style="margin:16px -16px;border-top:2px dashed var(--line);border-bottom:2px dashed var(--line);padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;background:var(--foam)"><span class="lab">When</span><b>Tomorrow, Nov 24 &middot; until sold out</b><span class="lab">Where</span><b>Near New York, NY</b><span class="lab">Menu</span><span>Ice cream, mochi, latte</span></div>
<div class="quote">"New drink that fixes all of that. Their new Bitter Matcha series drops nationwide soon."</div>
<div style="flex:1"></div>
<div style="display:flex;gap:8px;padding:14px 0 18px"><button class="btn p" style="flex:1;justify-content:center">Open in Maps</button><button class="btn">Add to calendar</button></div>
</div>
